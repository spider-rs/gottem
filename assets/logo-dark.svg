<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-label="gottem — universal scraper (dark)">
  <title>gottem (dark)</title>
  <defs>
    <linearGradient id="tierGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#34d399"/>
      <stop offset="48%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="ringShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <!-- Mark -->
  <g transform="translate(110,110)">
    <circle r="86" fill="none" stroke="#f8fafc" stroke-width="3" opacity="0.10"/>
    <circle r="72" fill="none" stroke="#f8fafc" stroke-width="3" opacity="0.18"/>
    <circle r="58" fill="none" stroke="#f8fafc" stroke-width="3" opacity="0.28"/>
    <circle r="44" fill="url(#tierGradient)"/>
    <circle r="44" fill="url(#ringShade)"/>
    <circle r="44" fill="none" stroke="#f8fafc" stroke-width="5"/>
    <path d="M -20 2 L -4 18 L 22 -14"
          stroke="#0f172a"
          stroke-width="9"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>
  </g>

  <!-- Wordmark — light on dark -->
  <text x="220" y="148"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="124"
        font-weight="900"
        fill="#f8fafc"
        letter-spacing="-5">gottem</text>

  <text x="222" y="186"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="18"
        font-weight="500"
        fill="#94a3b8"
        letter-spacing="2">UNIVERSAL · TIERED · ALWAYS GETS THE DATA</text>
</svg>

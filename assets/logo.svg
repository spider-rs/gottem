<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-label="gottem — universal scraper">
  <title>gottem</title>
  <defs>
    <linearGradient id="tierGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#10b981"/>
      <stop offset="48%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="ringShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- Mark: tier-gradient disc + checkmark = "got the data" -->
  <g transform="translate(110,110)">
    <!-- Outer tier ring (concentric, hints at T0 -> T9 escalation) -->
    <circle r="86" fill="none" stroke="#0f172a" stroke-width="3" opacity="0.18"/>
    <circle r="72" fill="none" stroke="#0f172a" stroke-width="3" opacity="0.28"/>
    <circle r="58" fill="none" stroke="#0f172a" stroke-width="3" opacity="0.38"/>
    <!-- Main disc -->
    <circle r="44" fill="url(#tierGradient)"/>
    <circle r="44" fill="url(#ringShade)"/>
    <circle r="44" fill="none" stroke="#0f172a" stroke-width="5"/>
    <!-- Checkmark: bold "got it" indicator -->
    <path d="M -20 2 L -4 18 L 22 -14"
          stroke="#0f172a"
          stroke-width="9"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>
  </g>

  <!-- Wordmark -->
  <text x="220" y="148"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="124"
        font-weight="900"
        fill="#0f172a"
        letter-spacing="-5">gottem</text>

  <!-- Tagline -->
  <text x="222" y="186"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="18"
        font-weight="500"
        fill="#475569"
        letter-spacing="2">UNIVERSAL · TIERED · ALWAYS GETS THE DATA</text>
</svg>

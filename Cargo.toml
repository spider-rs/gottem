[workspace]
resolver = "2"
members = [
    "crates/gottem-core",
    "crates/gottem-adapters-spider",
    "crates/gottem-adapters-http",
    "crates/gottem-adapters-chrome",
    "crates/gottem-adapters-captcha",
    "crates/gottem-adapters-browseruse",
    "crates/gottem-routes-builtin",
    "crates/gottem-cli",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0 OR MIT"
authors = ["Jeffrey Mendez <jeff@spider.cloud>"]
rust-version = "1.75"
repository = "https://github.com/spider-rs/gottem"

[workspace.dependencies]
serde      = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
async-trait = "0.1"
thiserror  = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
tokio      = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros"] }
bytes      = "1"
url        = { version = "2", features = ["serde"] }
http       = "1"
toml       = "0.8"
once_cell  = "1"

# Powerhouse: spider provides the RetryStrategy trait, HedgeTracker, AntiBotTech, RequestProxy.
# We depend with default-features = false to keep gottem-core light — the heavy fetching
# logic (Website, Client, basic feature stack) lives in gottem-adapters-spider, not core.
spider = { path = "../spider/spider", default-features = false, features = ["serde", "hedge", "sync"] }

# Match spider's reqwest version so cargo doesn't unify two different majors. Core uses no
# reqwest features; the http adapter crate enables what it needs (rustls, gzip, brotli, stream).
reqwest = { version = "0.13", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

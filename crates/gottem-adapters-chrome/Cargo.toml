[package]
name = "gottem-adapters-chrome"
version = "0.1.16"
description = "gottem CDP adapter: connects to Chrome via WebSocket (Brightdata Scraping Browser, Browserless, Spider Browser Cloud, local Chrome)."
readme = "README.md"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
gottem-core  = { path = "../gottem-core", version = "0.1.16" }
# CDP driver. `chromey` is the chromiumoxide fork the spider stack standardized
# on — we depend on it directly here (rather than reaching through
# `spider::chromiumoxide`) so this adapter stays decoupled from spider's
# feature flags and the type path in code is the canonical one. Same
# underlying build either way; spider's chrome feature also resolves to
# `chromey`, so there's no duplicate chromium-protocol compile.
#
# `chrome_tls_connection` enables tokio-tungstenite's native-tls so chromey can
# open `wss://` CDP endpoints (Kernel's per-session cdp_ws_url, Brightdata,
# Browserless are all wss). Without it the connect fails with
# `Ws(Url(TlsFeatureNotEnabled))`. Cargo unifies chromey's features across the
# build, so this also covers spider::Website's remote-connection path.
chromey      = { version = "2", features = ["chrome_tls_connection"] }
spider       = { workspace = true, features = ["basic", "chrome"] }
async-trait  = { workspace = true }
bytes        = { workspace = true }
url          = { workspace = true }
tokio        = { workspace = true, features = ["rt", "sync", "time", "macros"] }
futures-util = { workspace = true }
# Kernel (onkernel.com) needs a REST round-trip to mint a per-session CDP
# endpoint before the chromey connect — reqwest for create/delete, serde_json
# to parse the session response. `rustls` + `http2` mirror the sibling adapter
# crates so cargo unifies one reqwest build (workspace reqwest is
# default-features = false, so TLS must be opted in explicitly).
reqwest      = { workspace = true, features = ["json", "rustls", "http2"] }
serde_json   = { workspace = true }

[features]
default = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"

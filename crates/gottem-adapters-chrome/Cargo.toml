[package]
name = "gottem-adapters-chrome"
version = "0.1.3"
description = "gottem CDP adapter: connects to Chrome via WebSocket (Brightdata Scraping Browser, Browserless, Spider Browser Cloud, local Chrome)."
readme = "README.md"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
gottem-core  = { path = "../gottem-core", version = "0.1.3" }
# Enables spider's chrome feature, which re-exports chromiumoxide. Single chromiumoxide
# build across the workspace, no duplication with gottem-adapters-spider.
spider       = { workspace = true, features = ["basic", "chrome"] }
async-trait  = { workspace = true }
bytes        = { workspace = true }
url          = { workspace = true }
tokio        = { workspace = true, features = ["rt", "sync", "time", "macros"] }
futures-util = { workspace = true }

[features]
default = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"

[package]
name = "gottem-adapters-http"
version = "0.1.0"
description = "gottem HTTP adapters: DirectHttp, HttpJson, HttpJsonlStream for cloud vendor APIs (Firecrawl, Spider Cloud, ZenRows, ScrapingBee, Zyte, Brightdata)."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
gottem-core = { path = "../gottem-core" }
reqwest     = { workspace = true, features = ["rustls", "gzip", "brotli", "stream", "http2"] }
async-trait = { workspace = true }
bytes       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true, features = ["rt", "sync", "time", "macros"] }
url         = { workspace = true }
http        = { workspace = true }

[features]
default = []

[dev-dependencies]
wiremock = "0.6"
tokio    = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"

[package]
name = "gottem-routes-builtin"
version = "0.1.16"
description = "Built-in vendor route catalogs for gottem. Each vendor is a feature flag; routes ship as embedded TOML and load into a gottem RouteCatalogBuilder."
readme = "README.md"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
gottem-core = { path = "../gottem-core", version = "0.1.16" }

[features]
default            = ["spider-cloud", "firecrawl"]
spider-cloud       = []
firecrawl          = []
brightdata         = []
zyte               = []
zenrows            = []
scrapingbee        = []
scraperapi         = []
brightdata-browser = []
browserless        = []
spider-browser     = []
apify              = []
oxylabs            = []
two-captcha        = []
browserbase        = []
browser-use        = []
crawlbase          = []
diffbot            = []
dataforseo         = []
kernel             = []
all = [
    "spider-cloud", "firecrawl", "brightdata", "zyte", "zenrows", "scrapingbee",
    "scraperapi",
    "brightdata-browser", "browserless", "spider-browser",
    "apify", "oxylabs", "two-captcha",
    "browserbase", "browser-use",
    "crawlbase", "diffbot", "dataforseo", "kernel",
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
disallowed_types   = "deny"

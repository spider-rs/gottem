# 2Captcha solver route — used in CAPTCHA chains.
#
# Env var: 2CAPTCHA_API_KEY
#   Note: names starting with a digit aren't POSIX-valid, so bash/zsh refuse
#         `export 2CAPTCHA_API_KEY=...`. Use one of:
#           - a .env loader (dotenv) before launching gottem
#           - inline:  env 2CAPTCHA_API_KEY=sk-... gottem fetch ...
#           - your secrets manager / CI's secret injection (always works)
#
# Endpoint: https://2captcha.com/  (adapter handles in.php submit + res.php polling internally)
# Docs:    https://2captcha.com/2captcha-api
#
# Unlike a content-fetching route, this returns a captcha TOKEN as `content`, not
# the page HTML. Compose with another route to actually scrape:
#
#   1. Try the lowest-cost route → response is a CAPTCHA challenge
#   2. Extract siteKey from the page
#   3. fetch_once(captcha.2captcha, req_with_extras { siteKey, captchaType })
#   4. Replay original URL with the returned token embedded
#
# `req.extra` must include:
#   - captchaType: "recaptcha_v2" | "hcaptcha" | "turnstile"
#   - siteKey:     the captcha site key
#   - pageUrl:     (optional) defaults to req.url

[[route]]
id          = "captcha.2captcha"
adapter     = "captcha_2captcha"
endpoint    = "https://2captcha.com/"
method      = "POST"
tier        = 9
cost        = 200               # $0.02/solve (varies $0.001–$0.05 by type)
timeout_ms  = 180000
concurrency = 4

[route.auth]
kind = "bearer"
env  = "2CAPTCHA_API_KEY"

[route.caps]
captcha = true

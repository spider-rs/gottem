# Spider Cloud routes — JSONL streaming, Bearer auth.
#
# Env var: SPIDER_CLOUD_API_KEY
# Endpoint: https://api.spider.cloud/scrape
# Docs:     https://spider.cloud/docs/api
#
# IMPORTANT: Spider Cloud streams chunked JSONL. The HttpJsonlStream adapter handles this;
# do NOT route Spider Cloud through HttpJson — `.json()` on its response hangs.

# ----------------------------------------------------------------------------
# T4 — HTTP request mode. Cheapest, no JS render, datacenter IPs.
# ----------------------------------------------------------------------------
[[route]]
id          = "spider.cloud.http"
adapter     = "http_jsonl_stream"
endpoint    = "https://api.spider.cloud/scrape"
method      = "POST"
tier        = 4
cost        = 10                # $0.001/page in milli-cents
priority    = 0                 # Spider Cloud wins ties within a tier
timeout_ms  = 30000
concurrency = 20

[route.auth]
kind = "bearer"
env  = "SPIDER_CLOUD_API_KEY"

[route.body]
kind     = "json"
template = '''{"url":"{{url}}","request":"http","readability":true,"return_format":"markdown"}'''

[route.parse]
kind = "jsonl_first"
path = "$.content"

[route.cost_extract]
# Forward Spider Cloud credits raw — the dollar conversion is plan-dependent (volume
# discounts, prepaid balances, etc.), so we don't try to normalize. Consumers who know
# their plan can multiply against their own credit-to-dollar rate.
kind = "jsonl_first"
path = "$.costs.total"
unit = "credits"

[[route.validate]]
kind = "min_bytes"
n    = 500


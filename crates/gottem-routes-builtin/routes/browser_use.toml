# Browser Use Cloud — AI-driven browser agent. Takes a natural-language task.
#
# Env var: BROWSER_USE_API_KEY
# Endpoint: handled internally by gottem-adapters-browseruse (POST /api/v1/run-task
#          to submit, GET /api/v1/task/{id} to poll until status=="finished").
# Docs:    https://docs.browser-use.com/cloud-api/
#
# The `browser_use` adapter resolves the full submit + poll cycle inside one
# fetch — you get the AI's final `output` as `content`, no separate polling
# step required.

[[route]]
id          = "browseruse.cloud"
adapter     = "browser_use"
endpoint    = "https://api.browser-use.com/"   # base URL; adapter constructs /api/v1/* paths
method      = "POST"
tier        = 9
cost        = 1000              # ~$0.10/task baseline (AI agent compute is consumption-based)
timeout_ms  = 720000             # full submit + poll ceiling (~12 minutes)
concurrency = 2

[route.auth]
kind = "bearer"
env  = "BROWSER_USE_API_KEY"

[route.body]
kind     = "json"
template = '''{"task":"Visit {{url}} and extract the main content as clean markdown. Return only the content, no commentary.","save_browser_data":false,"use_adblock":true,"use_proxy":true}'''

[route.caps]
js          = true
residential = true
stealth     = true
captcha     = true              # the AI can solve captcha challenges in-line

[package]
name        = "gottem-cli"
version     = "0.1.2"
description = "gottem CLI: universal scraper that always gets the data."
readme      = "README.md"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "gottem"
path = "src/main.rs"

[dependencies]
gottem-core                = { path = "../gottem-core", version = "0.1.2" }
gottem-adapters-http       = { path = "../gottem-adapters-http", version = "0.1.2" }
gottem-adapters-spider     = { path = "../gottem-adapters-spider", version = "0.1.2" }
gottem-adapters-chrome     = { path = "../gottem-adapters-chrome", version = "0.1.2", optional = true }
gottem-adapters-captcha    = { path = "../gottem-adapters-captcha", version = "0.1.2" }
gottem-adapters-browseruse = { path = "../gottem-adapters-browseruse", version = "0.1.2" }
gottem-routes-builtin      = { path = "../gottem-routes-builtin", version = "0.1.2", features = ["all"] }

clap        = { version = "4", features = ["derive"] }
tokio       = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
url         = { workspace = true }
serde_json  = { workspace = true }
anyhow      = "1"

[features]
default = ["chrome"]
# Pulls in chromiumoxide via spider — adds ~30s to first build but enables T8 routes.
chrome  = ["dep:gottem-adapters-chrome"]

[lints.rust]
unsafe_code = "forbid"

[package]
name = "gottem-adapters-browseruse"
version = "0.1.6"
description = "gottem adapter for Browser Use Cloud — AI agent that runs a natural-language browser task. Submit + poll protocol exposed as a single Adapter call."
readme = "README.md"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
gottem-core = { path = "../gottem-core", version = "0.1.6" }
reqwest     = { workspace = true, features = ["rustls", "gzip", "brotli", "http2"] }
async-trait = { workspace = true }
bytes       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true, features = ["rt", "sync", "time", "macros"] }
url         = { workspace = true }
http        = { workspace = true }

[features]
default = []

[dev-dependencies]
wiremock = "0.6"
tokio    = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"

[package]
name = "gottem-adapters-spider"
version = "0.1.0"
description = "gottem adapter that dispatches through spider::Website for full local power (T0-T3)."
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
gottem-core = { path = "../gottem-core" }
spider      = { workspace = true, features = ["basic"] }
async-trait = { workspace = true }
bytes       = { workspace = true }
url         = { workspace = true }
tokio       = { workspace = true }
http        = { workspace = true }

[features]
default = []
chrome  = ["spider/chrome"]
smart   = ["spider/smart"]

[dev-dependencies]
wiremock = "0.6"
tokio    = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
await_holding_lock = "deny"
